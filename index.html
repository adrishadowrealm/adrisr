<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adri's Domain Expansion</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron',sans-serif; }

body {
  background: radial-gradient(circle at center, #0b0f1a, #000);
  color:white;
}

/* HEADER */
header {
  padding:25px;
  text-align:center;
  font-size:28px;
  background: linear-gradient(90deg,#ff003c,#7b00ff);
  box-shadow:0 0 15px rgba(255,0,100,0.5);
}

/* HERO */
.hero {
  padding:60px 20px;
  text-align:center;
}

.glow-text {
  font-size:42px;
  background: linear-gradient(90deg,#ff003c,#7b00ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow:0 0 10px rgba(255,0,100,0.6);
}

/* VIDEO */
video {
  margin-top:20px;
  width:300px;
  border-radius:15px;
  box-shadow:0 0 15px rgba(255,0,150,0.5);
}

/* LOCAL IMAGE */
.local-image {
  width:300px;
  border-radius:15px;
  margin-top:20px;
  box-shadow:0 0 15px rgba(150,0,255,0.6);
}

/* GRID */
.container {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:40px;
}

/* CARDS */
.card {
  background:rgba(20,20,20,0.85);
  border:1px solid rgba(255,0,150,0.3);
  border-radius:15px;
  padding:25px;
  text-align:center;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(150,0,255,0.6);
}

/* BUTTON */
button {
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#ff003c,#7b00ff);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* FOOTER */
footer {
  text-align:center;
  padding:20px;
  opacity:0.6;
}
</style>
</head>

<body>

<header>
  ADRI SHADOW REALM | DOMAIN
</header>

<section class="hero">
  <h1 class="glow-text">DOMAIN EXPANSION: SHADOW REALM ⚡</h1>
  <p>Yuji Itadori Energy</p>

  <video autoplay loop muted>
    <source src="yuji.mp4" type="video/mp4">
  </video>

  <!-- LOCAL IMAGE FROM YOUR PC -->
  <img src="Gemini_Generated_Image_uje3anuje3anuje3-removebg-preview.png" class="local-image">
</section>

<section class="container">

  <div class="card">
    <h2>About Me</h2>
    <p>Anime editor • JJK fan • Shadow realm clan</p>
  </div>

  <div class="card">
    <h2>My Discord Bot</h2>
    <p>Add my bot</p>
    <button onclick="window.open('https://discord.com/oauth2/authorize?client_id=1483202977253691442')">
      Add Bot
    </button>
  </div>

  <div class="card">
    <h2>TikTok</h2>
    <p>@xcon_adri</p>
    <button onclick="window.open('https://www.tiktok.com/@xcon_adri')">
      Follow
    </button>
  </div>

  <div class="card">
    <h2>Bot Status</h2>
    <p id="status">Checking...</p>
  </div>

  <div class="card">
    <h2>My Discord Server</h2>
    <p>Join the Shadow Realm 🔥</p>
    <button onclick="window.open('https://discord.gg/2vvsGKG83e')">
      Join Server
    </button>
  </div>

</section>

<footer>
  Jujutsu Kaisen • ADRI SR
</footer>

<script>
async function checkBot() {
  try {
    let res = await fetch("https://replit.com/@Tktokadrisr1/Discord-Linker");
    
    if (res.ok) {
      document.getElementById("status").innerText = "🟢 ONLINE";
    } else {
      document.getElementById("status").innerText = "🔴 OFFLINE";
    }

  } catch {
    document.getElementById("status").innerText = "🔴 OFFLINE";
  }
}

setInterval(checkBot, 10000);
checkBot();
</script>

</body>
</html>
