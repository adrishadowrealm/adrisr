<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADRI | SR | JJK Theme</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron',sans-serif; }

    body {
      background: radial-gradient(circle at center, #0b0f1a, #000);
      color:white;
    }

    header {
      padding:25px;
      text-align:center;
      font-size:28px;
      background: linear-gradient(90deg,#ff0000,#8b0000);
      box-shadow:0 0 20px rgba(255,0,0,0.6);
    }

    .hero {
      padding:60px 20px;
      text-align:center;
    }

    .hero h1 {
      font-size:42px;
      color:#ff2a2a;
      text-shadow:0 0 15px red;
    }

    video {
      margin-top:20px;
      width:300px;
      border-radius:15px;
      box-shadow:0 0 20px red;
    }

    .container {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:40px;
    }

    .card {
      background:rgba(20,20,20,0.8);
      border:1px solid rgba(255,0,0,0.3);
      border-radius:15px;
      padding:25px;
      text-align:center;
      transition:0.3s;
    }

    .card:hover {
      transform:scale(1.05);
      box-shadow:0 0 25px rgba(255,0,0,0.6);
    }

    button {
      margin-top:15px;
      padding:10px 20px;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,#ff0000,#ff4d4d);
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    footer {
      text-align:center;
      padding:20px;
      opacity:0.6;
    }
  </style>
</head>

<body>

<header>
  ADRI SHADOW REALM | JJK DOMAIN
</header>

<section class="hero">
  <h1>Yuji Itadori Energy ⚡</h1>
  <p>Domain Expansion: Infinite Drip</p>

  <!-- Yuji Animation Video -->
  <video autoplay loop muted>
    <source src="yuji.mp4" type="video/mp4">
  </video>
</section>

<section class="container">

  <div class="card">
    <h2>About Me</h2>
    <p>Anime editor • JJK fan • Shadow realm clan</p>
  </div>

  <div class="card">
    <h2>My Discord Bot</h2>
    <p>Add my bot to your server</p>
    <button onclick="window.open('https://discord.com/oauth2/authorize?client_id=1483202977253691442')">Add Bot</button>
  </div>

  <div class="card">
    <h2>TikTok</h2>
    <p>@xcon_adri</p>
    <button onclick="window.open('https://www.tiktok.com/@xcon_adri')">Follow</button>
  </div>

</section>

<footer>
  Jujutsu Kaisen • ADRI SR
</footer>

</body>
</html>
